<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mundo 3D | Vitrine</title>
    <meta name="theme-color" content="#d97706">
    <link rel="icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#d97706; --brand-dark:#4E342E; --muted:#78716c; --borda:#e7e5e4; --fundo:#fafaf9; }
        * { box-sizing:border-box; }
        body { font-family:'Inter', sans-serif; background:var(--fundo); margin:0; color:#292524; }
        header { background:var(--brand-dark); color:#fff; text-align:center; padding:28px 16px 22px; border-radius:0 0 24px 24px; }
        header img { width:86px; border-radius:16px; box-shadow:0 8px 20px rgba(0,0,0,0.25); }
        header h1 { margin:12px 0 4px; font-size:1.35rem; font-weight:900; }
        header p { margin:0; color:#d6d3d1; font-size:0.85rem; font-weight:600; }
        main { max-width:900px; margin:0 auto; padding:20px 16px 90px; }
        .grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:14px; }
        .peca { background:#fff; border:1px solid var(--borda); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 4px 12px rgba(78,52,46,0.06); }
        .peca img { width:100%; aspect-ratio:1/1; object-fit:cover; background:#f5f5f4; }
        .peca .info { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
        .peca h2 { font-size:0.95rem; margin:0; color:var(--brand-dark); font-weight:900; }
        .peca p { font-size:0.78rem; color:var(--muted); margin:0; line-height:1.35; flex:1; }
        .tag { align-self:flex-start; font-size:0.68rem; font-weight:800; padding:3px 8px; border-radius:20px; background:#dcfce7; color:#166534; }
        .tag.ultimas { background:#fef9c3; color:#854d0e; }
        .btn { display:block; text-align:center; text-decoration:none; background:#25D366; color:#fff; font-weight:900; font-size:0.82rem; padding:10px; border-radius:12px; margin-top:4px; }
        .aviso { text-align:center; color:var(--muted); font-weight:700; padding:40px 10px; }
        .flutuante { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); width:calc(100% - 32px); max-width:420px; background:#25D366; color:#fff; text-decoration:none; text-align:center; font-weight:900; padding:15px; border-radius:16px; box-shadow:0 10px 25px rgba(37,211,102,0.4); display:none; }
        footer { text-align:center; color:var(--muted); font-size:0.75rem; font-weight:600; padding:10px 16px 30px; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Mini Mundo 3D" onerror="this.src='logo.jpg'">
        <h1 id="titulo">Mini Mundo 3D</h1>
        <p id="subtitulo">Carregando vitrine...</p>
    </header>
    <main>
        <div id="grade" class="grade"></div>
        <div id="aviso" class="aviso" style="display:none;"></div>
    </main>
    <footer>Peças impressas em 3D com carinho 🌍🖨️</footer>
    <a id="flutuante" class="flutuante" target="_blank">💬 Falar no WhatsApp</a>

<script>
    // Mesmo servidor do painel. Para testar: localStorage.setItem('mm_api_url', 'http://localhost:8100/mmapi/api')
    const API = localStorage.getItem('mm_api_url') || "https://bdfernando.alwaysdata.net/mmapi/api";
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const zap = (tel, txt) => { let n = String(tel || '').replace(/\D/g, ''); if (n && n.length <= 11) n = '55' + n; return n ? `https://wa.me/${n}?text=${encodeURIComponent(txt)}` : ''; };

    async function carregar() {
        const codigo = new URLSearchParams(location.search).get('v');
        const aviso = document.getElementById('aviso');
        if (!codigo) { document.getElementById('subtitulo').innerText = ''; aviso.innerText = 'Link de vitrine incompleto. Peça o link certinho para quem te enviou. 😉'; aviso.style.display = 'block'; return; }
        try {
            const res = await (await fetch(`${API}?acao=vitrine_vendedor&v=${encodeURIComponent(codigo)}`)).json();
            if (!res.sucesso) throw new Error(res.erro || 'Vitrine não encontrada.');
            const v = res.vendedor;
            document.title = `Mini Mundo 3D | Vitrine de ${v.nome}`;
            document.getElementById('subtitulo').innerText = `Vitrine de ${v.nome} · peças a pronta entrega`;
            if (v.telefone) { const f = document.getElementById('flutuante'); f.href = zap(v.telefone, `Olá, ${v.nome}! Vi sua vitrine da Mini Mundo 3D e quero saber mais 😊`); f.style.display = 'block'; }
            if (!res.produtos.length) { aviso.innerText = 'No momento não há peças a pronta entrega. Chama no WhatsApp que a gente faz sob encomenda! 💬'; aviso.style.display = 'block'; return; }
            document.getElementById('grade').innerHTML = res.produtos.map(p => {
                const link = zap(v.telefone, `Olá, ${v.nome}! Tenho interesse em: ${p.nome} 😊`);
                return `<div class="peca"><img src="${esc(p.foto || 'logo.png')}" alt="${esc(p.nome)}" loading="lazy" onerror="this.src='logo.png'">
                    <div class="info"><span class="tag ${p.disponivel <= 2 ? 'ultimas' : ''}">${p.disponivel <= 2 ? '🔥 Últimas unidades' : '✅ Pronta entrega'}</span>
                    <h2>${esc(p.nome)}</h2><p>${esc(p.descricao)}</p>
                    ${link ? `<a class="btn" href="${link}" target="_blank">💬 Quero esse</a>` : ''}</div></div>`;
            }).join('');
        } catch (e) {
            document.getElementById('subtitulo').innerText = '';
            aviso.innerText = e.message === 'Vitrine não encontrada.' ? 'Essa vitrine não está mais disponível.' : 'Não foi possível carregar agora. Tente de novo em instantes.';
            aviso.style.display = 'block';
        }
    }
    carregar();
</script>
</body>
</html>
