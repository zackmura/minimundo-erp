<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mini Mundo | Presentes impressos em 3D</title>
    <meta name="description" content="Kits e peças impressos em 3D, feitos à mão pela Mini Mundo. Veja as fotos, monte sua sacola e peça pelo WhatsApp.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Mini Mundo · Impressão 3D & Design">
    <meta property="og:description" content="Kits e peças impressos em 3D, feitos à mão. Veja as fotos e os preços.">
    <meta property="og:image" content="https://minimundo.vivainteligente.net/logo.jpg">
    <meta name="theme-color" content="#f7f1e8">
    <link rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo:#f7f1e8; --papel:#fffdf9; --tinta:#2b1d18; --tinta2:#4a3329; --texto:#3d2e27; --suave:#857065; --ouro:#a8762f; --ouro2:#dcbd88; --ouro3:#f3e6cf;
            --linha:#ebe0cf; --botao:#2b1d18; --botaoTxt:#f7f1e8; --ok:#2e6b4c; --okBg:#e4f1e9;
            --sombra:0 1px 2px rgba(43,29,24,.05), 0 18px 40px -18px rgba(43,29,24,.22);
            --serif:'Fraunces', Georgia, 'Times New Roman', serif; --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .escuro { --sombra:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -18px rgba(0,0,0,.7); }
        * { box-sizing:border-box; }
        html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
        body { margin:0; font-family:var(--sans); color:var(--texto); background:var(--fundo); line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:clip; }
        img { display:block; max-width:100%; }
        button, input, textarea { font-family:inherit; }
        a { color:inherit; }
        [hidden] { display:none !important; }

        /* ---------- Topo ---------- */
        .hero { position:relative; overflow:hidden; text-align:center; padding:calc(46px + env(safe-area-inset-top)) 20px 38px; color:var(--tinta);
            background:radial-gradient(1100px 420px at 50% -140px, color-mix(in srgb, var(--papel) 85%, transparent), transparent 70%); }
        .hero-escuro .hero { background:radial-gradient(900px 520px at 50% 0%, var(--hero-fundo), var(--hero-fundo2)); color:var(--hero-tinta); border-radius:0 0 40px 40px; }
        .hero > *:not(.enfeite):not(.bolas) { position:relative; z-index:1; }
        .logo { width:112px; height:112px; margin:0 auto 18px; border-radius:50%; background:#fff; padding:8px; object-fit:contain; box-shadow:0 0 0 1px var(--ouro3), 0 0 0 7px var(--papel), 0 0 0 8px var(--ouro2), 0 16px 34px -12px rgba(0,0,0,.35); }
        .hero-escuro .logo { box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 0 0 7px rgba(255,255,255,.08), 0 0 0 8px var(--hero-ouro), 0 18px 40px -12px rgba(0,0,0,.6); }
        .sobre { margin:0 0 14px; font-size:.68rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:var(--ouro); }
        .hero-escuro .sobre { color:var(--hero-ouro); }
        .hero h1 { margin:0 auto; max-width:17ch; font-family:var(--serif); font-weight:500; font-size:clamp(2.1rem, 7vw, 3.5rem); line-height:1.05; letter-spacing:-.015em; font-variation-settings:'opsz' 144; }
        .divisor { display:flex; align-items:center; justify-content:center; gap:10px; margin:20px auto 16px; color:var(--ouro2); }
        .hero-escuro .divisor { color:var(--hero-ouro); }
        .divisor::before, .divisor::after { content:''; width:46px; height:1px; background:currentColor; }
        .divisor i { width:6px; height:6px; border:1px solid currentColor; transform:rotate(45deg); }
        .lead { margin:0 auto; max-width:38ch; font-size:1.02rem; color:var(--suave); }
        .hero-escuro .lead { color:var(--hero-suave); }
        .prazo { display:inline-flex; align-items:center; gap:8px; margin-top:20px; padding:9px 16px; border-radius:999px; font-size:.84rem; font-weight:600; background:var(--papel); color:var(--tinta); box-shadow:0 0 0 1px var(--ouro2); }
        .prazo b { color:var(--ouro); }
        .hero-escuro .prazo { background:rgba(255,255,255,.1); color:var(--hero-tinta); box-shadow:0 0 0 1px rgba(255,255,255,.22); }
        .hero-escuro .prazo b { color:var(--hero-ouro); }
        .hero-bt { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:22px; }
        .pilula { display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-weight:600; font-size:.88rem; padding:12px 20px; border-radius:999px; border:1px solid var(--botao); background:var(--botao); color:var(--botaoTxt); cursor:pointer; transition:transform .15s, opacity .15s; }
        .pilula:hover { transform:translateY(-1px); opacity:.92; }
        .pilula.clara { background:transparent; color:var(--tinta); border-color:var(--ouro2); }
        .hero-escuro .hero .pilula { background:var(--hero-ouro); border-color:var(--hero-ouro); color:var(--hero-fundo2); }
        .hero-escuro .hero .pilula.clara { background:transparent; color:var(--hero-tinta); border-color:rgba(255,255,255,.35); }
        .pilula svg { width:18px; height:18px; flex-shrink:0; }

        /* Enfeites do tema (neve, corações, confete…) */
        .enfeite { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
        .enfeite i { position:absolute; left:var(--x); top:-30px; font-style:normal; line-height:1; font-size:calc(15px * var(--s)); opacity:.8; animation:cair var(--d) linear var(--t) infinite; }
        @keyframes cair { from { transform:translate3d(0, 0, 0) rotate(0); } to { transform:translate3d(24px, 640px, 0) rotate(var(--r)); } }
        .enfeite-neve i { text-shadow:0 0 6px rgba(255,255,255,.4); }
        .enfeite-confete i { width:calc(9px * var(--s)); height:calc(5px * var(--s)); background:currentColor; border-radius:1px; opacity:.7; }
        .enfeite-flores i { opacity:.55; }
        .enfeite-coracoes i { top:auto; bottom:-30px; opacity:.45; animation-name:subir; }
        @keyframes subir { from { transform:translateY(0) scale(.8); } to { transform:translateY(-640px) scale(1.1) rotate(12deg); } }
        .enfeite-brilho i, .enfeite-estrelas i { top:var(--y); opacity:0; animation-name:piscar; }
        @keyframes piscar { 0%, 100% { opacity:0; transform:scale(.6); } 50% { opacity:.75; transform:scale(1); } }
        .enfeite-ovos i { top:var(--y); width:calc(15px * var(--s)); height:calc(20px * var(--s)); border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:currentColor; opacity:.35; animation-name:boiar; }
        @keyframes boiar { 0%, 100% { transform:translateY(0) rotate(-8deg); } 50% { transform:translateY(-10px) rotate(8deg); } }
        .bolas { position:absolute; inset:0; pointer-events:none; z-index:0; }
        .bolas svg { position:absolute; top:0; width:58px; animation:balanca 5s ease-in-out infinite; transform-origin:top center; }
        .bolas svg:nth-child(1) { left:7%; } .bolas svg:nth-child(2) { left:18%; width:44px; animation-delay:-1.5s; } .bolas svg:nth-child(3) { right:9%; animation-delay:-3s; } .bolas svg:nth-child(4) { right:21%; width:40px; animation-delay:-.7s; }
        @keyframes balanca { 0%, 100% { transform:rotate(-4deg); } 50% { transform:rotate(4deg); } }

        .capa { max-width:1180px; margin:22px auto 0; padding:0 20px; }
        .capa img { width:100%; aspect-ratio:21 / 9; object-fit:cover; border-radius:26px; box-shadow:var(--sombra); }

        /* ---------- Filtros ---------- */
        .filtros { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--fundo) 88%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid transparent; transition:border-color .2s; margin-top:12px; }
        .filtros.colado { border-bottom-color:var(--linha); }
        .filtros-in { max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
        .filtros-in::-webkit-scrollbar { display:none; }
        .chip { flex-shrink:0; border:1px solid var(--linha); background:var(--papel); color:var(--tinta2); font-size:.84rem; font-weight:600; padding:9px 16px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:all .15s; }
        .chip:hover { border-color:var(--ouro2); }
        .chip.on { background:var(--botao); border-color:var(--botao); color:var(--botaoTxt); }
        .chip small { font-weight:500; opacity:.7; margin-left:4px; }

        /* ---------- Produtos ---------- */
        main { max-width:1180px; margin:0 auto; padding:18px 20px 40px; }
        .secao { margin-top:26px; }
        .secao:first-child { margin-top:8px; }
        .sec-tit { display:flex; align-items:baseline; gap:12px; margin:0 0 18px; font-family:var(--serif); font-weight:500; font-size:1.7rem; color:var(--tinta); letter-spacing:-.01em; }
        .sec-tit small { font-family:var(--sans); font-size:.8rem; font-weight:500; color:var(--suave); }
        .sec-tit::after { content:''; flex:1; height:1px; background:var(--linha); align-self:center; }
        .grade { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 372px)); justify-content:center; gap:26px; }
        .grade > * { min-width:0; }
        .card { background:var(--papel); border:1px solid var(--linha); border-radius:26px; overflow:hidden; box-shadow:var(--sombra); display:flex; flex-direction:column; transition:transform .25s, box-shadow .25s; scroll-margin-top:84px; }
        @media (hover:hover) { .card:hover { transform:translateY(-3px); } }
        .card.marcado { box-shadow:0 0 0 3px var(--ouro2), var(--sombra); }
        .fotos { position:relative; aspect-ratio:1 / 1; background:var(--ouro3); }
        .trilho { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
        .trilho::-webkit-scrollbar { display:none; }
        .foto { flex:0 0 100%; height:100%; scroll-snap-align:center; border:none; padding:0; background:none; cursor:zoom-in; }
        .foto img { width:100%; height:100%; object-fit:cover; }
        .sem-foto { display:flex; align-items:center; justify-content:center; height:100%; }
        .sem-foto img { width:42%; opacity:.9; }
        .selos { position:absolute; top:14px; left:14px; right:14px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none; }
        .selo { display:inline-flex; align-items:center; gap:7px; font-size:.72rem; font-weight:600; padding:7px 12px; border-radius:999px; background:rgba(255,253,249,.93); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#a8762f; box-shadow:0 2px 10px rgba(0,0,0,.12); }
        .selo::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
        .selo.pronta { color:#2e6b4c; }
        .selo.kit { color:#5b3a8c; } .selo.kit::before { display:none; }
        .selo.promo { background:var(--ouro); color:#fff; margin-left:auto; } .selo.promo::before { display:none; }
        .pontos { position:absolute; left:0; right:0; bottom:12px; display:flex; justify-content:center; gap:6px; pointer-events:none; }
        .pontos i { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.6); box-shadow:0 0 0 1px rgba(0,0,0,.12); transition:all .2s; }
        .pontos i.on { width:18px; border-radius:6px; background:#fff; }
        .seta { position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,253,249,.92); color:#2b1d18; display:none; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.15); }
        .seta svg { width:18px; height:18px; } .seta.esq { left:12px; } .seta.dir { right:12px; }
        @media (hover:hover) { .fotos:hover .seta { display:flex; } }
        .corpo { padding:22px; display:flex; flex-direction:column; flex:1; }
        .cat { margin:0 0 6px; font-size:.68rem; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--ouro); }
        .card h3 { margin:0; font-family:var(--serif); font-weight:500; font-size:1.5rem; line-height:1.15; color:var(--tinta); letter-spacing:-.01em; }
        .desc { margin:10px 0 0; font-size:.93rem; color:var(--suave); white-space:pre-line; }
        .vem { margin-top:18px; }
        .vem-rot { display:block; font-size:.68rem; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--tinta2); margin-bottom:10px; }
        .vem ul { list-style:none; margin:0; padding:0; display:grid; gap:9px; }
        .vem li { display:flex; align-items:center; gap:11px; font-size:.9rem; }
        .vem li img { width:38px; height:38px; border-radius:50%; object-fit:cover; flex-shrink:0; background:var(--ouro3); box-shadow:0 0 0 1px var(--linha), 0 0 0 3px var(--papel); }
        .vem li b { font-family:var(--serif); font-weight:600; color:var(--ouro); margin-right:3px; }
        .rodape { margin-top:auto; padding-top:20px; }
        .rodape-in { border-top:1px solid var(--linha); padding-top:18px; display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; }
        .preco { display:flex; flex-direction:column; gap:2px; }
        .preco s { font-size:.8rem; color:var(--suave); }
        .preco strong { font-family:var(--serif); font-weight:500; font-size:1.85rem; line-height:1; color:var(--tinta); font-variant-numeric:lining-nums; }
        .preco .consulta { font-family:var(--serif); font-style:italic; font-size:1.2rem; color:var(--tinta); }
        .economia { align-self:flex-start; margin-top:6px; font-size:.72rem; font-weight:600; color:var(--ok); background:var(--okBg); padding:4px 10px; border-radius:999px; }
        .acoes { display:flex; gap:8px; align-items:center; }
        .btn-add { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer; background:var(--botao); color:var(--botaoTxt); font-weight:600; font-size:.9rem; padding:13px 20px; border-radius:999px; transition:transform .15s, opacity .15s; text-decoration:none; }
        .btn-add:hover { transform:translateY(-1px); opacity:.92; }
        .btn-add svg { width:18px; height:18px; }
        .passo { display:inline-flex; align-items:center; border-radius:999px; background:var(--botao); color:var(--botaoTxt); overflow:hidden; }
        .passo button { width:44px; height:46px; border:none; background:none; color:inherit; font-size:1.25rem; cursor:pointer; }
        .passo b { min-width:26px; text-align:center; font-size:.95rem; }
        .btn-share { width:48px; height:48px; flex-shrink:0; border-radius:50%; border:1px solid var(--ouro2); background:transparent; color:var(--tinta); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
        .btn-share:hover { background:var(--ouro3); }
        .btn-share svg { width:19px; height:19px; }

        /* Outras coleções */
        .outras { margin-top:48px; }
        .colecoes { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 360px)); justify-content:center; gap:22px; }
        .colecao { position:relative; display:flex; flex-direction:column; text-decoration:none; border-radius:24px; overflow:hidden; background:var(--c-papel); border:1px solid var(--c-linha); box-shadow:var(--sombra); color:var(--c-tinta); transition:transform .2s; }
        .colecao:hover { transform:translateY(-3px); }
        .colecao .c-capa { aspect-ratio:16 / 10; background:var(--c-ouro3) center / cover no-repeat; position:relative; }
        .colecao .c-emoji { position:absolute; left:16px; bottom:-20px; width:46px; height:46px; border-radius:50%; background:var(--c-papel); display:flex; align-items:center; justify-content:center; font-size:1.4rem; box-shadow:0 4px 14px rgba(0,0,0,.15); }
        .colecao .c-corpo { padding:28px 18px 18px; }
        .colecao .c-corpo b { display:block; font-family:var(--serif); font-weight:500; font-size:1.3rem; line-height:1.2; }
        .colecao .c-corpo span { display:block; font-size:.85rem; opacity:.75; margin-top:6px; }
        .colecao .c-ver { display:inline-block; margin-top:12px; font-size:.82rem; font-weight:600; color:var(--c-ouro); }

        .esqueleto { border-radius:26px; overflow:hidden; background:var(--papel); border:1px solid var(--linha); }
        .esqueleto div { background:linear-gradient(90deg, var(--ouro3) 0%, var(--papel) 50%, var(--ouro3) 100%); background-size:200% 100%; animation:brilhar 1.4s infinite linear; }
        .esqueleto .e-foto { aspect-ratio:1 / 1; } .esqueleto .e-linha { height:14px; margin:18px 22px 0; border-radius:8px; } .esqueleto .e-linha.curta { width:45%; margin-bottom:24px; }
        @keyframes brilhar { to { background-position:-200% 0; } }
        .aviso { text-align:center; padding:48px 20px; color:var(--suave); }
        .aviso h2 { font-family:var(--serif); font-weight:500; font-size:1.7rem; color:var(--tinta); margin:0 0 8px; }
        .aviso p { margin:0 0 20px; }

        footer { text-align:center; padding:36px 20px calc(110px + env(safe-area-inset-bottom)); border-top:1px solid var(--linha); }
        footer img { width:64px; height:64px; margin:0 auto 12px; border-radius:50%; background:#fff; padding:5px; object-fit:contain; box-shadow:0 0 0 1px var(--ouro3); }
        footer .frase { font-family:var(--serif); font-style:italic; font-size:1.15rem; color:var(--tinta); margin:0 0 6px; }
        footer .marca { font-size:.68rem; letter-spacing:.24em; text-transform:uppercase; color:var(--ouro); margin:0; }
        footer .links { display:flex; justify-content:center; gap:18px; margin-top:16px; font-size:.86rem; font-weight:600; }
        footer .links a { text-decoration:none; color:var(--tinta2); border-bottom:1px solid var(--ouro2); padding-bottom:1px; cursor:pointer; }

        /* ---------- Sacola ---------- */
        .barra { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:30; width:calc(100% - 32px); max-width:460px; display:flex; align-items:center; gap:12px; padding:10px 10px 10px 18px; border-radius:999px; background:var(--botao); color:var(--botaoTxt); box-shadow:0 14px 34px -10px rgba(0,0,0,.45); cursor:pointer; border:none; text-align:left; animation:aparece .25s ease; }
        @keyframes aparece { from { transform:translate(-50%, 20px); opacity:0; } }
        .barra svg { width:22px; height:22px; flex-shrink:0; }
        .barra span { flex:1; min-width:0; font-size:.9rem; } .barra span b { display:block; font-size:1rem; }
        .barra em { font-style:normal; font-weight:600; font-size:.86rem; background:color-mix(in srgb, var(--botaoTxt) 16%, transparent); padding:10px 16px; border-radius:999px; white-space:nowrap; }
        .zap-flutuante { position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:30; width:58px; height:58px; border-radius:50%; background:#25d366; color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -6px rgba(37,211,102,.55), 0 2px 6px rgba(0,0,0,.15); }
        .zap-flutuante svg { width:30px; height:30px; }
        .fundo-sacola { position:fixed; inset:0; z-index:40; background:rgba(20,14,10,.5); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:surge .2s ease; }
        @keyframes surge { from { opacity:0; } }
        .sacola { position:fixed; z-index:41; left:0; right:0; bottom:0; max-height:88vh; overflow:auto; background:var(--papel); color:var(--texto); border-radius:28px 28px 0 0; padding:10px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.25); animation:sobe .25s ease; }
        @keyframes sobe { from { transform:translateY(40px); opacity:0; } }
        @media (min-width:700px) { .sacola { left:auto; right:24px; bottom:24px; width:420px; border-radius:26px; max-height:calc(100vh - 48px); } }
        .sacola .alca { width:42px; height:5px; border-radius:5px; background:var(--linha); margin:2px auto 12px; }
        .sacola h2 { display:flex; align-items:center; justify-content:space-between; margin:0 0 6px; font-family:var(--serif); font-weight:500; font-size:1.6rem; color:var(--tinta); }
        .sacola h2 button { border:none; background:var(--ouro3); color:var(--tinta); width:38px; height:38px; border-radius:50%; font-size:1.1rem; cursor:pointer; }
        .s-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--linha); }
        .s-item img { width:52px; height:52px; border-radius:14px; object-fit:cover; background:var(--ouro3); flex-shrink:0; }
        .s-info { flex:1; min-width:0; } .s-info b { display:block; font-size:.92rem; color:var(--tinta); line-height:1.25; } .s-info small { color:var(--suave); font-size:.8rem; }
        .s-passo { display:inline-flex; align-items:center; border:1px solid var(--linha); border-radius:999px; }
        .s-passo button { width:34px; height:34px; border:none; background:none; color:var(--tinta); font-size:1.1rem; cursor:pointer; }
        .s-passo b { min-width:20px; text-align:center; font-size:.88rem; }
        .s-total { display:flex; justify-content:space-between; align-items:baseline; margin:16px 0 14px; font-size:.95rem; }
        .s-total strong { font-family:var(--serif); font-weight:500; font-size:1.7rem; color:var(--tinta); }
        .s-campo { display:block; width:100%; border:1px solid var(--linha); background:var(--fundo); color:var(--texto); border-radius:14px; padding:12px 14px; font-size:16px; margin-bottom:10px; resize:vertical; }
        .s-enviar { width:100%; justify-content:center; background:#25d366 !important; color:#fff !important; padding:15px 20px; font-size:1rem; }
        .s-nota { text-align:center; font-size:.78rem; color:var(--suave); margin:10px 0 0; }
        .toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); background:var(--tinta); color:var(--papel); font-size:.88rem; font-weight:500; padding:12px 20px; border-radius:999px; opacity:0; pointer-events:none; transition:all .25s; z-index:50; white-space:nowrap; }
        .toast.on { opacity:1; transform:translate(-50%, 0); }

        @media (max-width:640px) {
            .hero { padding-top:calc(34px + env(safe-area-inset-top)); padding-bottom:30px; }
            .hero-escuro .hero { border-radius:0 0 30px 30px; }
            .logo { width:94px; height:94px; }
            .bolas svg { width:42px; } .bolas svg:nth-child(2), .bolas svg:nth-child(4) { display:none; }
            .capa { padding:0 16px; } .capa img { aspect-ratio:16 / 10; border-radius:20px; }
            .filtros-in { padding:10px 16px; }
            main { padding:14px 16px 32px; }
            .grade { grid-template-columns:minmax(0, 1fr); gap:20px; }

            .corpo { padding:20px 18px 18px; }
            .card h3 { font-size:1.4rem; }
            .acoes { width:100%; } .btn-add, .passo { flex:1; } .passo { justify-content:space-between; }
        }
        @media (prefers-reduced-motion:reduce) {
            *, *::before, *::after { transition:none !important; animation:none !important; }
            .enfeite i { top:var(--y); opacity:.5; }
        }

<body>
    <header class="hero" id="hero">
        <img class="logo" src="logo.png" alt="Mini Mundo" onerror="this.src='logo.jpg'">
        <p class="sobre" id="selo">Mini Mundo · Impressão 3D &amp; Design</p>
        <h1 id="titulo">&nbsp;</h1>
        <div class="divisor" aria-hidden="true"><i></i></div>
        <p class="lead" id="texto"></p>
        <div id="prazo"></div>
        <div class="hero-bt" id="hero-bt"></div>
    </header>
    <div class="capa" id="capa" hidden></div>
    <nav class="filtros" id="filtros" aria-label="Filtrar produtos" hidden><div class="filtros-in" id="filtros-in"></div></nav>
    <main>
        <div id="conteudo">
            <div class="grade">
                <div class="esqueleto"><div class="e-foto"></div><div class="e-linha"></div><div class="e-linha curta"></div></div>
                <div class="esqueleto"><div class="e-foto"></div><div class="e-linha"></div><div class="e-linha curta"></div></div>
                <div class="esqueleto"><div class="e-foto"></div><div class="e-linha"></div><div class="e-linha curta"></div></div>
            </div>
        </div>
        <section class="outras" id="outras" hidden></section>
    </main>
    <footer>
        <img src="logo.png" alt="" onerror="this.src='logo.jpg'">
        <p class="frase">Feito à mão, camada por camada.</p>
        <p class="marca">Mini Mundo · Impressão 3D &amp; Design</p>
        <div class="links" id="rodape-links"></div>
    </footer>
    <button class="barra" id="barra" type="button" hidden onclick="abrirSacola()"></button>
    <a class="zap-flutuante" id="zap-flutuante" target="_blank" rel="noopener" aria-label="Falar no WhatsApp" hidden></a>
    <div id="sacola-box"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="temas.js?v=5.7.0"></script>
<script src="galeria.js?v=5.7.0"></script>
<script>
    // Página de venda para clientes: loja.html?p=natal (uma página por tema). Sem "p" mostra as coleções no ar.
    // Os dados vêm do servidor (ações públicas): nome, texto, preço, fotos e peças. Custo e estoque nunca chegam aqui.
    // Para testar: localStorage.setItem('mm_api_url', 'http://localhost:8100/mmapi/api')
    const API = localStorage.getItem('mm_api_url') || 'https://bdfernando.alwaysdata.net/mmapi/api';
    const SOCIAL = API.replace(/\/api$/, '') + '/p/';
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const real = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const zap = (tel, txt) => { let n = String(tel || '').replace(/\D/g, ''); if (n && n.length <= 11) n = '55' + n; return n ? `https://wa.me/${n}?text=${encodeURIComponent(txt)}` : ''; };
    const instaLink = s => { s = String(s || '').trim(); if (!s) return ''; return /^https?:\/\//i.test(s) ? s : `https://instagram.com/${s.replace(/^@/, '').replace(/^instagram\.com\//i, '')}`; };
    const PARAMS = new URLSearchParams(location.search), SLUG = (PARAMS.get('p') || '').toLowerCase();
    const IC = {
        zap: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91A9.85 9.85 0 0 0 12.04 2Zm5.8 14.13c-.25.69-1.44 1.32-1.98 1.37-.5.05-.98.24-3.32-.69-2.8-1.1-4.58-3.97-4.72-4.15-.14-.19-1.13-1.5-1.13-2.87 0-1.36.71-2.03.97-2.31.25-.28.55-.35.73-.35l.53.01c.17 0 .4-.06.62.48.25.6.85 2.06.92 2.21.08.15.12.32.03.51-.1.19-.14.31-.28.48-.14.16-.3.37-.42.49-.14.14-.29.29-.12.57.16.28.73 1.2 1.57 1.95 1.08.96 1.99 1.26 2.27 1.4.28.14.45.12.61-.07.17-.19.71-.83.9-1.11.19-.28.37-.23.63-.14.25.09 1.62.76 1.9.9.28.14.46.21.53.33.07.11.07.66-.18 1.35Z"/></svg>',
        insta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
        share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"/></svg>',
        sacola: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
        esq: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
        dir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'
    };
    const BOLA = (cor, brilho) => `<svg viewBox="0 0 60 140" aria-hidden="true"><line x1="30" y1="0" x2="30" y2="78" stroke="${brilho}" stroke-width="1.2" opacity=".7"/><rect x="24" y="74" width="12" height="9" rx="2" fill="${brilho}"/><circle cx="30" cy="104" r="22" fill="${cor}"/><ellipse cx="22" cy="96" rx="6" ry="9" fill="#fff" opacity=".28" transform="rotate(25 22 96)"/><path d="M10 104c6 4 34 4 40 0" stroke="${brilho}" stroke-width="1.5" fill="none" opacity=".8"/></svg>`;

    let DADOS = null, ITENS = [], FILTRO = 'tudo', SACOLA = [];
    const chaveSacola = () => 'mm_sacola_' + SLUG;
    function lerSacola() { try { SACOLA = JSON.parse(localStorage.getItem(chaveSacola()) || '[]').filter(s => s && s.id && s.qtd > 0); } catch (e) { SACOLA = []; } }
    function gravarSacola() { try { localStorage.setItem(chaveSacola(), JSON.stringify(SACOLA)); } catch (e) { /* aba anônima */ } }
    function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2400); }
    const post = async corpo => { const r = await (await fetch(API, { method: 'POST', body: JSON.stringify(corpo) })).json(); if (!r.sucesso) throw new Error(r.erro || 'erro'); return r; };

    // ---------- Topo ----------
    function montarTopo(pagina, tema) {
        const t = temaMM(tema);
        aplicarTemaMM(document.documentElement, tema);
        document.querySelector('meta[name="theme-color"]').content = t.hero ? t.hero.fundo : t.cores.fundo;
        const hero = $('hero');
        hero.querySelectorAll('.enfeite, .bolas').forEach(e => e.remove());
        hero.insertAdjacentHTML('afterbegin', enfeiteMM(tema));
        if (t.enfeite === 'neve') hero.insertAdjacentHTML('afterbegin', `<div class="bolas" aria-hidden="true">${BOLA('#b3262f', '#e3c47e') + BOLA('#e3c47e', '#e3c47e') + BOLA('#c9a24a', '#e3c47e') + BOLA('#b3262f', '#e3c47e')}</div>`);
        $('selo').textContent = t.selo;
        $('titulo').innerHTML = esc(pagina.titulo || t.titulo);
        $('texto').textContent = pagina.texto || t.texto;
        document.title = `${pagina.titulo || t.titulo} | Mini Mundo`;
    }
    function montarContato(textoTopo) {
        const L = DADOS.loja || {}, z = zap(L.whatsapp, 'Olá! Vim pela página da Mini Mundo.'), ig = instaLink(L.instagram);
        $('hero-bt').innerHTML = (textoTopo || '') + (z && !textoTopo ? `<a class="pilula" href="${esc(z)}" target="_blank" rel="noopener">${IC.zap} Fale com a gente</a>` : '') + (ig ? `<a class="pilula clara" href="${esc(ig)}" target="_blank" rel="noopener">${IC.insta} Instagram</a>` : '');
        $('rodape-links').innerHTML = (z ? `<a href="${esc(z)}" target="_blank" rel="noopener">WhatsApp</a>` : '') + (ig ? `<a href="${esc(ig)}" target="_blank" rel="noopener">Instagram</a>` : '') + (SLUG ? `<a onclick="compartilharPagina()">Compartilhar</a>` : '');
        if (z) { $('zap-flutuante').href = z; $('zap-flutuante').innerHTML = IC.zap; }
    }
    // "Encomendas até 15/12 · faltam 12 dias"
    function montarPrazo(ate) {
        const m = String(ate || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return;
        const fim = new Date(+m[1], m[2] - 1, +m[3]), hoje = new Date(); hoje.setHours(0, 0, 0, 0);
        const dias = Math.round((fim - hoje) / 864e5), data = `${m[3]}/${m[2]}`;
        $('prazo').innerHTML = `<span class="prazo">🎁 ${dias < 0 ? `Encomendas encerradas em ${data}. <b>Fale com a gente</b>` : `Encomendas até <b>${data}</b> · ${dias === 0 ? '<b>último dia!</b>' : dias === 1 ? 'falta 1 dia' : `faltam ${dias} dias`}`}</span>`;
    }

    // ---------- Carregar ----------
    async function carregar() {
        try {
            if (!SLUG) return mostrarColecoes(await post({ acao: 'paginas_publicas' }));
            DADOS = await post({ acao: 'pagina_publica', p: SLUG });
            if (!DADOS.encontrada || DADOS.encerrada) return mostrarFora();
            const pg = DADOS.pagina;
            montarTopo(pg, pg.tema); montarContato(); montarPrazo(pg.pedidos_ate);
            if (pg.capa) { $('capa').hidden = false; $('capa').innerHTML = `<img src="${esc(pg.capa)}" alt="${esc(pg.titulo)}">`; }
            ITENS = DADOS.itens || [];
            lerSacola(); SACOLA = SACOLA.filter(s => ITENS.some(i => i.id === s.id && i.preco !== undefined));
            montarFiltros(); renderizar(); atualizarBarra(); mostrarOutras(DADOS.outras, 'Veja também');
            marcarDoLink();
            if (!sessionStorage.getItem('mm_visita_' + SLUG)) { sessionStorage.setItem('mm_visita_' + SLUG, '1'); post({ acao: 'registrar_pagina', p: SLUG, evento: 'visita' }).catch(() => {}); }
        } catch (e) {
            montarTopo({ titulo: 'Mini Mundo' }, 'padrao');
            $('conteudo').innerHTML = `<div class="aviso"><h2>Não conseguimos abrir a página agora</h2><p>Verifique a internet e tente de novo em instantes.</p><button class="pilula" onclick="location.reload()">Tentar de novo</button></div>`;
        }
    }
    // Página que não existe ou já encerrou: mostra as outras coleções
    function mostrarFora() {
        const tema = DADOS.encerrada ? DADOS.pagina.tema : 'padrao';
        montarTopo({ titulo: DADOS.encerrada ? DADOS.pagina.titulo : 'Página não encontrada', texto: DADOS.encerrada ? 'Esta coleção já encerrou. Obrigado a todos que fizeram parte dela!' : 'O link pode ter mudado. Veja as coleções que estão no ar.' }, tema);
        montarContato();
        $('conteudo').innerHTML = DADOS.outras && DADOS.outras.length ? '' : `<div class="aviso"><h2>Novidades em breve</h2><p>Fale com a gente pelo WhatsApp para encomendar.</p></div>`;
        mostrarOutras(DADOS.outras, 'Coleções no ar');
    }
    // Sem "p": lista as coleções no ar (se só houver uma, já abre ela)
    function mostrarColecoes(r) {
        DADOS = r;
        if (r.paginas.length === 1) return location.replace(`loja.html?p=${encodeURIComponent(r.paginas[0].slug)}`);
        montarTopo({ titulo: 'Coleções Mini Mundo', texto: 'Escolha uma coleção para ver os kits e as peças, montar sua sacola e pedir pelo WhatsApp.' }, 'padrao');
        montarContato();
        $('conteudo').innerHTML = r.paginas.length ? '' : `<div class="aviso"><h2>Novas coleções em breve</h2><p>Enquanto isso, fale com a gente pelo WhatsApp.</p></div>`;
        mostrarOutras(r.paginas, '');
    }
    function mostrarOutras(lista, titulo) {
        if (!lista || !lista.length) return;
        $('outras').hidden = false;
        $('outras').innerHTML = (titulo ? `<h2 class="sec-tit">${esc(titulo)}</h2>` : '') + `<div class="colecoes">${lista.map(p => {
            const t = temaMM(p.tema), c = t.cores;
            return `<a class="colecao" href="loja.html?p=${encodeURIComponent(p.slug)}" style="--c-papel:${c.papel};--c-linha:${c.linha};--c-tinta:${c.tinta};--c-ouro:${c.ouro};--c-ouro3:${t.hero ? t.hero.fundo : c.ouro3}">
                <span class="c-capa" style="${p.capa ? `background-image:url('${esc(p.capa).replace(/'/g, '%27')}')` : ''}"><span class="c-emoji">${t.emoji}</span></span>
                <span class="c-corpo"><b>${esc(p.titulo)}</b><span>${esc(p.texto || t.texto)}</span><span class="c-ver">Ver coleção · ${p.qtd} ${p.qtd === 1 ? 'item' : 'itens'} →</span></span></a>`;
        }).join('')}</div>`;
    }

    // ---------- Produtos ----------
    function montarFiltros() {
        const kits = ITENS.filter(i => i.tipo === 'kit').length, pecas = ITENS.length - kits, prontos = ITENS.filter(i => i.pronta_entrega).length;
        const cats = [...new Set(ITENS.map(i => i.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
        const ops = [['tudo', 'Tudo', ITENS.length]];
        if (kits && pecas) ops.push(['kit', 'Kits', kits], ['peca', 'Peças avulsas', pecas]);
        if (prontos && prontos < ITENS.length) ops.push(['pronta', 'Pronta entrega', prontos]);
        if (cats.length > 1) cats.forEach(c => ops.push(['c:' + c, c, ITENS.filter(i => i.categoria === c).length]));
        if (ops.length < 2) return;
        $('filtros').hidden = false;
        $('filtros-in').innerHTML = ops.map(([v, r, n]) => `<button class="chip ${v === FILTRO ? 'on' : ''}" data-v="${esc(v)}">${esc(r)}<small>${n}</small></button>`).join('');
        $('filtros-in').querySelectorAll('.chip').forEach(b => b.onclick = () => { FILTRO = b.dataset.v; montarFiltros(); renderizar(); window.scrollTo({ top: $('filtros').offsetTop - 2, behavior: 'smooth' }); });
    }
    function renderizar() {
        if (!ITENS.length) { $('conteudo').innerHTML = `<div class="aviso"><h2>Os produtos estão chegando</h2><p>Em breve esta coleção vai estar cheia de novidades.</p></div>`; return; }
        const cartoes = lista => `<div class="grade">${lista.map(cartao).join('')}</div>`;
        if (FILTRO !== 'tudo') {
            const lista = ITENS.filter(i => FILTRO === 'kit' || FILTRO === 'peca' ? i.tipo === FILTRO : FILTRO === 'pronta' ? i.pronta_entrega : 'c:' + i.categoria === FILTRO);
            $('conteudo').innerHTML = cartoes(lista);
        } else {
            // Tudo: destaques primeiro, depois kits e peças avulsas (cada grupo com título)
            const dest = ITENS.filter(i => i.destaque), resto = ITENS.filter(i => !i.destaque);
            const kits = resto.filter(i => i.tipo === 'kit'), pecas = resto.filter(i => i.tipo !== 'kit');
            const grupos = [[dest, 'Destaques'], [kits, 'Kits'], [pecas, kits.length || dest.length ? 'Peças avulsas' : '']].filter(g => g[0].length);
            $('conteudo').innerHTML = grupos.map(([l, t]) => `<section class="secao">${grupos.length > 1 && t ? `<h2 class="sec-tit">${t}<small>${l.length}</small></h2>` : ''}${cartoes(l)}</section>`).join('');
        }
        document.querySelectorAll('.trilho').forEach(t => t.addEventListener('scroll', () => {
            const n = Math.round(t.scrollLeft / t.clientWidth), p = $('pontos-' + t.dataset.id);
            if (p) [...p.children].forEach((b, j) => b.classList.toggle('on', j === n));
        }, { passive: true }));
    }
    const naSacola = id => (SACOLA.find(s => s.id === id) || {}).qtd || 0;
    function cartao(it) {
        const fotos = it.fotos || [], qtd = naSacola(it.id), podePedir = !!(DADOS.loja || {}).whatsapp;
        const desconto = it.de ? Math.round((1 - it.preco / it.de) * 100) : 0, economia = it.separadas ? it.separadas - it.preco : 0;
        return `<article class="card" id="item-${it.id}">
            <div class="fotos">
                ${fotos.length ? `<div class="trilho" data-id="${it.id}">${fotos.map((f, j) => `<button class="foto" type="button" onclick="verFotos(${it.id}, ${j})" aria-label="Ver foto ${j + 1} de ${esc(it.nome)}"><img src="${esc(f)}" alt="${esc(it.nome)}" loading="${j ? 'lazy' : 'eager'}" onerror="this.src='logo.png'"></button>`).join('')}</div>` : '<div class="sem-foto"><img src="logo.png" alt=""></div>'}
                <div class="selos">${it.tipo === 'kit' ? '<span class="selo kit">Kit</span>' : ''}<span class="selo ${it.pronta_entrega ? 'pronta' : ''}">${it.pronta_entrega ? 'Pronta entrega' : 'Sob encomenda'}</span>${desconto >= 5 ? `<span class="selo promo">−${desconto}%</span>` : ''}</div>
                ${fotos.length > 1 ? `<button class="seta esq" type="button" aria-label="Foto anterior" onclick="passar(${it.id}, -1)">${IC.esq}</button><button class="seta dir" type="button" aria-label="Próxima foto" onclick="passar(${it.id}, 1)">${IC.dir}</button>
                    <div class="pontos" id="pontos-${it.id}">${fotos.map((_, j) => `<i class="${j ? '' : 'on'}"></i>`).join('')}</div>` : ''}
            </div>
            <div class="corpo">
                ${it.categoria ? `<p class="cat">${esc(it.categoria)}</p>` : ''}
                <h3>${esc(it.nome)}</h3>
                ${it.descricao ? `<p class="desc">${esc(it.descricao)}</p>` : ''}
                ${it.itens && it.itens.length ? `<div class="vem"><span class="vem-rot">Vem no kit</span><ul>${it.itens.map(p => `<li><img src="${esc(p.foto || 'logo.png')}" alt="" loading="lazy" onerror="this.src='logo.png'"><span><b>${p.qtd}×</b> ${esc(p.nome)}</span></li>`).join('')}</ul></div>` : ''}
                <div class="rodape"><div class="rodape-in">
                    <div class="preco">${it.preco ? `${it.de ? `<s>de ${real(it.de)}</s>` : economia > 0 ? `<s>Separadas: ${real(it.separadas)}</s>` : ''}<strong>${real(it.preco)}</strong>${economia > 0 ? `<span class="economia">Você economiza ${real(economia)}</span>` : ''}` : '<span class="consulta">Sob consulta</span>'}</div>
                    <div class="acoes">${podePedir ? (qtd ? `<span class="passo"><button type="button" onclick="mudar(${it.id}, -1)" aria-label="Tirar um">−</button><b>${qtd}</b><button type="button" onclick="mudar(${it.id}, 1)" aria-label="Mais um">+</button></span>`
                        : `<button class="btn-add" type="button" onclick="mudar(${it.id}, 1)">${IC.sacola} Adicionar</button>`) : ''}
                        <button class="btn-share" type="button" onclick="compartilhar(${it.id})" aria-label="Compartilhar ${esc(it.nome)}">${IC.share}</button></div>
                </div></div>
            </div></article>`;
    }
    function passar(id, d) { const t = document.querySelector(`.trilho[data-id="${id}"]`); if (t) t.scrollBy({ left: d * t.clientWidth, behavior: 'smooth' }); }
    function verFotos(id, j) { const it = ITENS.find(i => i.id === id); if (it && it.fotos.length) abrirGaleria({ fotos: it.fotos, indice: j, titulo: it.nome }); }
    // Link de um produto (loja.html?p=natal&i=12): rola até ele e destaca
    function marcarDoLink() {
        const id = parseInt(PARAMS.get('i')); if (!id) return;
        const it = ITENS.find(i => i.id === id), el = $('item-' + id); if (!it || !el) return;
        document.title = `${it.nome} | Mini Mundo`; el.classList.add('marcado');
        setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
    }
    async function compartilharLink(titulo, texto, url) {
        if (navigator.share) { try { await navigator.share({ title: titulo, text: texto, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
        try { await navigator.clipboard.writeText(url); toast('Link copiado'); } catch (e) { prompt('Copie o link:', url); }
    }
    function compartilhar(id) { const it = ITENS.find(i => i.id === id); if (it) compartilharLink(it.nome, `${it.nome}${it.preco ? ` por ${real(it.preco)}` : ''} · Mini Mundo`, SOCIAL + encodeURIComponent(SLUG) + '/' + id); }
    function compartilharPagina() { compartilharLink(DADOS.pagina.titulo, `${DADOS.pagina.titulo} · Mini Mundo`, SOCIAL + encodeURIComponent(SLUG)); }

    // ---------- Sacola (vai inteira numa mensagem de WhatsApp) ----------
    function mudar(id, d) {
        const s = SACOLA.find(x => x.id === id);
        if (s) { s.qtd += d; if (s.qtd <= 0) SACOLA = SACOLA.filter(x => x !== s); } else if (d > 0) SACOLA.push({ id, qtd: d });
        gravarSacola();
        const el = $('item-' + id); if (el) { const it = ITENS.find(i => i.id === id); const novo = document.createElement('div'); novo.innerHTML = cartao(it); const card = novo.firstElementChild; if (el.classList.contains('marcado')) card.classList.add('marcado'); el.replaceWith(card);
            card.querySelector('.trilho')?.addEventListener('scroll', function () { const n = Math.round(this.scrollLeft / this.clientWidth), p = $('pontos-' + id); if (p) [...p.children].forEach((b, j) => b.classList.toggle('on', j === n)); }, { passive: true }); }
        atualizarBarra();
        if (d > 0 && naSacola(id) === 1) toast('Adicionado à sacola');
        if ($('sacola')) abrirSacola();
    }
    const totais = () => {
        let total = 0, semPreco = 0, n = 0;
        SACOLA.forEach(s => { const it = ITENS.find(i => i.id === s.id); if (!it) return; n += s.qtd; if (it.preco) total += it.preco * s.qtd; else semPreco++; });
        return { total, semPreco, n };
    };
    function atualizarBarra() {
        const { total, semPreco, n } = totais(), temZap = !!(DADOS && DADOS.loja && DADOS.loja.whatsapp);
        $('barra').hidden = !n; $('zap-flutuante').hidden = !!n || !temZap;
        if (n) $('barra').innerHTML = `${IC.sacola}<span>Sua sacola<b>${n} ${n === 1 ? 'item' : 'itens'} · ${real(total)}${semPreco ? ' +' : ''}</b></span><em>Ver e pedir</em>`;
    }
    function abrirSacola() {
        const { total, semPreco, n } = totais();
        if (!n) return fecharSacola();
        const linhas = SACOLA.map(s => { const it = ITENS.find(i => i.id === s.id); if (!it) return '';
            return `<div class="s-item"><img src="${esc(it.fotos[0] || 'logo.png')}" alt="" onerror="this.src='logo.png'"><div class="s-info"><b>${esc(it.nome)}</b><small>${it.preco ? `${real(it.preco)} cada` : 'preço a combinar'}</small></div>
                <span class="s-passo"><button type="button" onclick="mudar(${it.id}, -1)" aria-label="Tirar um">−</button><b>${s.qtd}</b><button type="button" onclick="mudar(${it.id}, 1)" aria-label="Mais um">+</button></span></div>`; }).join('');
        const nome = $('s-nome') ? $('s-nome').value : (localStorage.getItem('mm_cliente_nome') || ''), obs = $('s-obs') ? $('s-obs').value : '';
        $('sacola-box').innerHTML = `<div class="fundo-sacola" onclick="fecharSacola()"></div><div class="sacola" id="sacola" role="dialog" aria-modal="true" aria-label="Sua sacola">
            <div class="alca"></div><h2>Sua sacola <button type="button" onclick="fecharSacola()" aria-label="Fechar">✕</button></h2>${linhas}
            <div class="s-total"><span>${n} ${n === 1 ? 'item' : 'itens'}${semPreco ? ` (${semPreco} a combinar)` : ''}</span><strong>${real(total)}</strong></div>
            <input class="s-campo" id="s-nome" placeholder="Seu nome" autocomplete="name" value="${esc(nome)}">
            <textarea class="s-campo" id="s-obs" rows="2" placeholder="Observações (cores, nome para personalizar, data…)">${esc(obs)}</textarea>
            <button class="btn-add s-enviar" type="button" onclick="enviarPedido()">${IC.zap} Enviar pedido pelo WhatsApp</button>
            <p class="s-nota">Você confirma tudo com a gente na conversa: entrega, pagamento e prazo.</p></div>`;
    }
    function fecharSacola() { $('sacola-box').innerHTML = ''; }
    function enviarPedido() {
        const { total, semPreco } = totais(), nome = $('s-nome').value.trim(), obs = $('s-obs').value.trim();
        try { localStorage.setItem('mm_cliente_nome', nome); } catch (e) { /* sem espaço */ }
        const linhas = SACOLA.map(s => { const it = ITENS.find(i => i.id === s.id); return it ? `• ${s.qtd}× ${it.nome}${it.preco ? ` — ${real(it.preco * s.qtd)}` : ' — a combinar'}` : ''; }).filter(Boolean);
        const msg = `Olá! Quero fazer um pedido pela página *${DADOS.pagina.titulo}*:\n\n${linhas.join('\n')}\n\n*Total: ${real(total)}*${semPreco ? ' + itens a combinar' : ''}${nome ? `\nNome: ${nome}` : ''}${obs ? `\nObs.: ${obs}` : ''}\n\n${location.origin}${location.pathname}?p=${encodeURIComponent(SLUG)}`;
        const url = zap(DADOS.loja.whatsapp, msg); if (!url) return;
        post({ acao: 'registrar_pagina', p: SLUG, evento: 'pedido' }).catch(() => {});
        window.open(url, '_blank', 'noopener');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sacola') && !galeriaAberta()) fecharSacola(); });

    new IntersectionObserver(([e]) => $('filtros').classList.toggle('colado', !e.isIntersecting)).observe($('hero'));
    carregar();
</script>
</body>
</html>
