<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mini Mundo | Presentes impressos em 3D</title>
    <meta name="description" content="Kits e peças impressos em 3D, feitos à mão pela Mini Mundo. Veja as fotos, monte sua sacola e faça seu pedido.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Mini Mundo · Impressão 3D & Design">
    <meta property="og:title" content="Mini Mundo · Presentes impressos em 3D">
    <meta property="og:description" content="Kits e peças feitos à mão, camada por camada. Veja as fotos, os preços e faça seu pedido.">
    <meta property="og:image" content="https://minimundo.vivainteligente.net/logo.jpg">
    <meta name="theme-color" content="#f7f1e8">
    <link rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* v7.5: visual de loja (topo fixo com sacola, vitrine no topo, grade de produtos, produto em janela, música) */
        :root {
            --fundo:#f7f1e8; --papel:#fffdf9; --tinta:#2b1d18; --tinta2:#4a3329; --texto:#3d2e27; --suave:#857065; --ouro:#a8762f; --ouro2:#dcbd88; --ouro3:#f3e6cf;
            --linha:#ebe0cf; --botao:#2b1d18; --botaoTxt:#f7f1e8; --ok:#2e6b4c; --okBg:#e4f1e9; --fita1:#2b1d18; --fita2:#a8762f; --fita3:#dcbd88;
            --sombra:0 1px 2px rgba(43,29,24,.05), 0 14px 34px -18px rgba(43,29,24,.28);
            --sombra2:0 2px 6px rgba(43,29,24,.06), 0 26px 50px -22px rgba(43,29,24,.38);
            --serif:'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --topo-h:62px;
        }
        .escuro { --sombra:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -18px rgba(0,0,0,.7); --sombra2:0 2px 6px rgba(0,0,0,.3), 0 26px 50px -22px rgba(0,0,0,.8); }
        * { box-sizing:border-box; }
        html { -webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-padding-top:calc(var(--topo-h) + 60px); }
        body { margin:0; font-family:var(--sans); color:var(--texto); background-color:var(--fundo); background-image:var(--padrao, none); background-size:148px 148px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:clip; }
        html.travado, html.travado body { overflow:hidden; }
        img { display:block; max-width:100%; }
        button, input, textarea { font-family:inherit; }
        a { color:inherit; }
        [hidden] { display:none !important; }
        .por-cima { position:relative; z-index:1; }
        .ic svg, svg.ic { width:20px; height:20px; flex-shrink:0; }

        /* ---------- Barra do topo: marca, busca, música e sacola (some ao descer e volta ao subir) ---------- */
        .topo-loja { position:sticky; top:0; z-index:30; background:var(--papel); background:color-mix(in srgb, var(--papel) 88%, transparent); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--linha); transition:transform .3s ease; }
        .topo-oculto .topo-loja { transform:translateY(-102%); }
        .tl-in { max-width:1240px; margin:0 auto; height:var(--topo-h); padding:0 16px; display:flex; align-items:center; gap:10px; }
        .tl-marca { display:flex; align-items:center; gap:10px; flex:1; min-width:0; text-decoration:none; color:var(--tinta); border:none; background:none; padding:0; cursor:pointer; text-align:left; }
        .tl-marca img { width:42px; height:42px; border-radius:50%; background:#fff; padding:3px; object-fit:contain; flex-shrink:0; box-shadow:0 0 0 1px var(--linha), 0 4px 10px -4px rgba(0,0,0,.25); }
        .tl-marca span { min-width:0; }
        .tl-marca b { display:block; font-family:var(--serif); font-weight:800; font-size:1.02rem; line-height:1.15; letter-spacing:-.01em; }
        .tl-marca small { display:block; font-size:.72rem; color:var(--suave); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .tl-acoes { display:flex; align-items:center; gap:8px; }
        .tl-bt { position:relative; width:44px; height:44px; border-radius:50%; border:1px solid var(--linha); background:var(--papel); color:var(--tinta); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s, transform .15s; flex-shrink:0; }
        .tl-bt:hover { background:var(--ouro3); }
        .tl-bt:active { transform:scale(.94); }
        .tl-bt svg { width:21px; height:21px; }
        .tl-bt > b { position:absolute; top:-5px; right:-5px; min-width:21px; height:21px; padding:0 6px; border-radius:999px; background:var(--ouro); color:#fff; font-size:.72rem; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--papel); }
        .tl-bt.pulo { animation:pulo .55s ease; }
        @keyframes pulo { 30% { transform:scale(1.2) rotate(-6deg); } 60% { transform:scale(.94); } }
        .tl-sacola { background:var(--botao); color:var(--botaoTxt); border-color:var(--botao); }
        .tl-sacola:hover { background:var(--botao); opacity:.9; }
        .tl-musica.tocando { background:var(--ouro3); border-color:var(--ouro2); }
        .eq { display:flex; align-items:flex-end; gap:2.5px; height:16px; }
        .eq i { width:3px; height:35%; border-radius:2px; background:currentColor; }
        .tocando .eq i { animation:eq .9s ease-in-out infinite; } .tocando .eq i:nth-child(2) { animation-delay:-.3s; } .tocando .eq i:nth-child(3) { animation-delay:-.6s; }
        .tl-musica:not(.tocando) .eq { opacity:.6; }
        .tl-musica.espera::before { content:''; position:absolute; inset:-1px; border-radius:50%; border:2px solid var(--ouro2); animation:chama 2s ease-out infinite; }
        @keyframes chama { from { transform:scale(1); opacity:.9; } to { transform:scale(1.45); opacity:0; } }
        .tl-musica.desligada::after { content:''; position:absolute; width:24px; height:2px; background:currentColor; transform:rotate(-45deg); border-radius:2px; }
        @keyframes eq { 0%, 100% { height:25%; } 50% { height:100%; } }
        .tl-busca { max-width:1240px; margin:0 auto; padding:0 16px 12px; display:flex; align-items:center; gap:8px; }
        .tl-busca label { flex:1; display:flex; align-items:center; gap:8px; height:46px; padding:0 14px; border-radius:14px; background:var(--fundo); border:1px solid var(--linha); color:var(--suave); }
        .tl-busca label:focus-within { border-color:var(--ouro2); box-shadow:0 0 0 3px color-mix(in srgb, var(--ouro2) 40%, transparent); }
        .tl-busca input { flex:1; min-width:0; border:none; background:none; outline:none; font-size:16px; color:var(--tinta); }
        .tl-busca button { border:none; background:none; color:var(--suave); font-weight:600; font-size:.88rem; cursor:pointer; padding:10px 4px; }
        .bolha { position:fixed; z-index:32; top:calc(var(--topo-h) + 6px); right:12px; max-width:250px; padding:11px 14px; border-radius:14px; background:var(--tinta); color:var(--papel); font-size:.82rem; font-weight:600; line-height:1.35; box-shadow:0 14px 30px -10px rgba(0,0,0,.45); animation:bolha .3s ease; cursor:pointer; }
        .bolha::before { content:''; position:absolute; top:-6px; right:var(--seta, 70px); width:12px; height:12px; background:inherit; transform:rotate(45deg); border-radius:2px; }
        @keyframes bolha { from { opacity:0; transform:translateY(-6px); } }

        /* ---------- Vitrine do topo (hero) ---------- */
        .hero { position:relative; overflow:hidden; color:var(--tinta); background:radial-gradient(900px 420px at 15% 0%, var(--papel), transparent 70%), linear-gradient(180deg, var(--ouro3) 0%, var(--fundo) 100%); }
        .hero-escuro .hero { background:radial-gradient(900px 560px at 25% 0%, var(--hero-fundo), var(--hero-fundo2)); color:var(--hero-tinta); }
        .hero-in { position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:46px 20px 56px; display:grid; grid-template-columns:minmax(0, 1.05fr) minmax(0, .95fr); gap:44px; align-items:center; }
        .hero-in.centro { grid-template-columns:minmax(0, 1fr); text-align:center; padding-bottom:44px; }
        .hero-in.centro .lead { margin-left:auto; margin-right:auto; }
        .hero-in.centro .hero-bt, .hero-in.centro .contagem { justify-content:center; }
        .sobre { display:inline-flex; align-items:center; gap:8px; margin:0; padding:7px 14px; border-radius:999px; font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; background:var(--papel); color:var(--ouro); box-shadow:0 0 0 1px var(--linha); }
        .hero-escuro .sobre { background:rgba(255,255,255,.1); color:var(--hero-ouro); box-shadow:0 0 0 1px rgba(255,255,255,.2); }
        .hero h1 { margin:18px 0 0; font-family:var(--serif); font-weight:800; font-size:clamp(2.15rem, 5vw, 3.8rem); line-height:1.04; letter-spacing:-.035em; text-wrap:balance; }
        .hero h1 em { font-style:normal; color:var(--ouro); }
        .hero-escuro .hero h1 em { color:var(--hero-ouro); }
        .lead { margin:16px 0 0; max-width:44ch; font-size:1.06rem; color:var(--suave); text-wrap:pretty; }
        .hero-escuro .lead { color:var(--hero-suave); }
        .contagem { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-top:22px; }
        .ct-rot { font-size:.88rem; font-weight:600; color:var(--tinta2); }
        .ct-rot b { color:var(--ouro); }
        .hero-escuro .ct-rot { color:var(--hero-tinta); } .hero-escuro .ct-rot b { color:var(--hero-ouro); }
        .ct-num { display:flex; gap:6px; }
        .ct-num span { min-width:54px; padding:7px 8px 6px; border-radius:12px; text-align:center; background:var(--papel); box-shadow:0 0 0 1px var(--linha); }
        .hero-escuro .ct-num span { background:rgba(255,255,255,.1); box-shadow:0 0 0 1px rgba(255,255,255,.18); }
        .ct-num b { display:block; font-family:var(--serif); font-weight:800; font-size:1.25rem; line-height:1.05; font-variant-numeric:tabular-nums; }
        .ct-num small { display:block; font-size:.62rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); }
        .hero-escuro .ct-num small { color:var(--hero-suave); }
        .ct-fim { display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; font-size:.86rem; font-weight:600; background:var(--papel); box-shadow:0 0 0 1px var(--ouro2); }
        .hero-escuro .ct-fim { background:rgba(255,255,255,.1); }
        .hero-bt { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:26px; }
        .atende { display:block; flex-basis:100%; margin:0 0 2px; font-size:.88rem; color:var(--suave); }
        .atende b { color:var(--tinta); }
        .atende i { display:inline-block; width:8px; height:8px; margin:0 8px 1px 2px; vertical-align:middle; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.18); }
        .hero-escuro .atende { color:var(--hero-suave); } .hero-escuro .atende b { color:var(--hero-tinta); }
        .pilula { display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; font-weight:700; font-size:.92rem; padding:14px 22px; border-radius:999px; border:1px solid var(--botao); background:var(--botao); color:var(--botaoTxt); cursor:pointer; transition:transform .15s, opacity .15s, box-shadow .15s; }
        .pilula:hover { transform:translateY(-1px); box-shadow:0 10px 22px -10px rgba(0,0,0,.45); }
        .pilula.clara { background:transparent; color:var(--tinta); border-color:var(--ouro2); }
        .pilula.clara:hover { box-shadow:none; background:var(--ouro3); }
        .hero-escuro .hero .pilula { background:var(--hero-ouro); border-color:var(--hero-ouro); color:var(--hero-fundo2); }
        .hero-escuro .hero .pilula.clara { background:transparent; color:var(--hero-tinta); border-color:rgba(255,255,255,.35); }
        .hero-escuro .hero .pilula.clara:hover { background:rgba(255,255,255,.08); }
        .pilula svg { width:18px; height:18px; flex-shrink:0; }
        .pilula.zap { background:#25d366; border-color:#25d366; color:#fff; }
        .pilula.so-ic { width:50px; height:50px; padding:0; } .pilula.so-ic span { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
        .hero-escuro .hero .pilula.zap { background:#25d366; border-color:#25d366; color:#fff; }
        /* Fotos de produtos flutuando ao lado do título (tocar abre o produto) */
        .hero-vitrine { position:relative; height:470px; }
        .hv { position:absolute; display:block; padding:0; border:7px solid var(--papel); border-radius:30px; overflow:hidden; background:var(--papel); box-shadow:0 30px 60px -22px rgba(0,0,0,.5); cursor:pointer; animation:flutua 7s ease-in-out infinite; transition:box-shadow .2s; }
        .hv:hover { box-shadow:0 36px 70px -20px rgba(0,0,0,.6); }
        .hv img { width:100%; height:100%; object-fit:cover; aspect-ratio:1; }
        .hv-tag { position:absolute; left:10px; right:10px; bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; border-radius:14px; background:rgba(255,253,249,.94); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#2b1d18; font-size:.78rem; font-weight:700; text-align:left; box-shadow:0 4px 14px rgba(0,0,0,.15); }
        .hv-tag span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .hv-tag b { white-space:nowrap; font-family:var(--serif); font-weight:800; }
        .hv:nth-child(1) { left:2%; top:10%; width:56%; --r:-6deg; z-index:2; }
        .hv:nth-child(2) { right:0; top:0; width:42%; --r:5deg; animation-delay:-2.3s; }
        .hv:nth-child(3) { right:12%; bottom:0; width:40%; --r:-2deg; animation-delay:-4.6s; z-index:3; }
        .hero-vitrine.n1 .hv { left:12%; width:76%; top:2%; }
        .hero-vitrine.n2 .hv:nth-child(2) { top:auto; bottom:2%; }
        @keyframes flutua { 0%, 100% { transform:translateY(0) rotate(var(--r, 0deg)); } 50% { transform:translateY(-12px) rotate(var(--r, 0deg)); } }
        .hv-capa { width:100%; aspect-ratio:4 / 3; object-fit:cover; border-radius:30px; border:7px solid var(--papel); box-shadow:0 30px 60px -22px rgba(0,0,0,.5); }
        .hero-vitrine.capa { height:auto; }

        /* Enfeites do tema (neve, corações, confete…) */
        .enfeite { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
        .enfeite i { position:absolute; left:var(--x); top:-30px; font-style:normal; line-height:1; font-size:calc(15px * var(--s)); opacity:.8; animation:cair var(--d) linear var(--t) infinite; }
        @keyframes cair { from { transform:translate3d(0, 0, 0) rotate(0); } to { transform:translate3d(24px, 640px, 0) rotate(var(--r)); } }
        .enfeite-neve i { text-shadow:0 0 6px rgba(255,255,255,.4); }
        .enfeite-confete i { width:calc(9px * var(--s)); height:calc(5px * var(--s)); background:currentColor; border-radius:1px; opacity:.7; }
        .enfeite-flores i { opacity:.55; }
        .enfeite-coracoes i { top:auto; bottom:-30px; opacity:.45; animation-name:subir; }
        @keyframes subir { from { transform:translateY(0) scale(.8); } to { transform:translateY(-640px) scale(1.1) rotate(12deg); } }
        .enfeite-brilho i, .enfeite-estrelas i { top:var(--y); opacity:0; animation-name:piscar; }
        @keyframes piscar { 0%, 100% { opacity:0; transform:scale(.6); } 50% { opacity:.75; transform:scale(1); } }
        .enfeite-ovos i { top:var(--y); width:calc(15px * var(--s)); height:calc(20px * var(--s)); border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:currentColor; opacity:.35; animation-name:boiar; }
        @keyframes boiar { 0%, 100% { transform:translateY(0) rotate(-8deg); } 50% { transform:translateY(-10px) rotate(8deg); } }
        .enfeite.fixo { position:fixed; z-index:0; }
        .enfeite.fixo i { color:var(--ouro2) !important; text-shadow:none; animation-name:cairTela; }
        .enfeite-neve.fixo i, .enfeite-flores.fixo i, .enfeite-confete.fixo i { opacity:.4; }
        .enfeite-coracoes.fixo i { animation-name:subirTela; opacity:.3; }
        .enfeite-brilho.fixo i, .enfeite-estrelas.fixo i { animation-name:piscar; }
        .enfeite-ovos.fixo i { animation-name:boiar; opacity:.25; }
        @keyframes cairTela { from { transform:translate3d(0, 0, 0) rotate(0); } to { transform:translate3d(30px, calc(100vh + 60px), 0) rotate(var(--r)); } }
        @keyframes subirTela { from { transform:translateY(0); } to { transform:translateY(calc(-100vh - 60px)) rotate(12deg); } }
        .bolas { position:absolute; inset:0; pointer-events:none; z-index:0; }
        .bolas svg { position:absolute; top:0; width:54px; animation:balanca 5s ease-in-out infinite; transform-origin:top center; }
        .bolas svg:nth-child(1) { left:4%; } .bolas svg:nth-child(2) { left:44%; width:40px; animation-delay:-1.5s; } .bolas svg:nth-child(3) { right:5%; animation-delay:-3s; } .bolas svg:nth-child(4) { right:40%; width:36px; animation-delay:-.7s; }
        @keyframes balanca { 0%, 100% { transform:rotate(-4deg); } 50% { transform:rotate(4deg); } }

        /* ---------- Faixa de confiança ---------- */
        .confianca { position:relative; z-index:2; max-width:1240px; margin:-26px auto 0; padding:0 20px; }
        .conf-in { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:4px; padding:10px; border-radius:22px; background:var(--papel); border:1px solid var(--linha); box-shadow:var(--sombra); }
        .conf { display:flex; align-items:center; gap:12px; padding:8px 10px; min-width:0; }
        .conf > span { width:42px; height:42px; flex-shrink:0; border-radius:14px; display:flex; align-items:center; justify-content:center; background:var(--ouro3); color:var(--ouro); }
        .conf > span svg { width:21px; height:21px; }
        .conf b { display:block; font-size:.86rem; color:var(--tinta); line-height:1.25; }
        .conf small { display:block; font-size:.74rem; color:var(--suave); line-height:1.3; }

        /* ---------- Filtros (grudam embaixo da barra do topo) ---------- */
        .filtros { position:sticky; top:var(--topo-h); z-index:20; margin-top:22px; background:var(--fundo); background:color-mix(in srgb, var(--fundo) 90%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid transparent; transition:top .3s ease, border-color .2s; }
        .topo-oculto .filtros { top:0; }
        .filtros.colado { border-bottom-color:var(--linha); }
        .filtros-in { max-width:1240px; margin:0 auto; padding:10px 20px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
        .filtros-in::-webkit-scrollbar { display:none; }
        .chip { flex-shrink:0; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--linha); background:var(--papel); color:var(--tinta2); font-size:.86rem; font-weight:600; padding:9px 16px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:all .15s; }
        .chip:hover { border-color:var(--ouro2); }
        .chip.on { background:var(--botao); border-color:var(--botao); color:var(--botaoTxt); box-shadow:0 6px 14px -8px rgba(0,0,0,.5); }
        .chip small { font-weight:600; font-size:.72rem; opacity:.65; }

        /* ---------- Produtos ---------- */
        main { position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:14px 20px 40px; }
        .secao { position:relative; margin-top:34px; }
        .secao:first-child { margin-top:14px; }
        .sec-tit { display:flex; align-items:center; gap:10px; margin:0 0 16px; font-family:var(--serif); font-weight:800; font-size:1.55rem; line-height:1.15; color:var(--tinta); letter-spacing:-.02em; }
        .sec-tit .orn { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:12px; background:var(--ouro3); color:var(--ouro); font-size:.95rem; flex-shrink:0; }
        .sec-tit small { font-family:var(--sans); font-size:.8rem; font-weight:600; color:var(--suave); padding:3px 9px; border-radius:999px; background:var(--papel); box-shadow:0 0 0 1px var(--linha); }
        .sec-tit .car-bts { margin-left:auto; display:flex; gap:6px; }
        .car-bts button { width:40px; height:40px; border-radius:50%; border:1px solid var(--linha); background:var(--papel); color:var(--tinta); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
        .car-bts button:hover { background:var(--ouro3); } .car-bts svg { width:18px; height:18px; }
        /* Destaques: faixa com a cor do tema e cartões maiores que deslizam para o lado */
        .secao.destaques { padding:26px 0 26px 24px; border-radius:30px; overflow:hidden; background:var(--ouro3); box-shadow:inset 0 0 0 1px var(--linha); }
        .secao.destaques .sec-tit { padding-right:24px; }
        .hero-escuro .secao.destaques { background:radial-gradient(800px 400px at 30% 0%, var(--hero-fundo), var(--hero-fundo2)); box-shadow:none; }

        esq: S('<path d="m15 6-6 6 6 6"/>'), dir: S('<path d="m9 6 6 6-6 6"/>'), baixo: S('<path d="m6 9 6 6 6-6"/>'),

    };
    const BOLA = (cor, brilho) => `<svg viewBox="0 0 60 140" aria-hidden="true"><line x1="30" y1="0" x2="30" y2="78" stroke="${brilho}" stroke-width="1.2" opacity=".7"/><rect x="24" y="74" width="12" height="9" rx="2" fill="${brilho}"/><circle cx="30" cy="104" r="22" fill="${cor}"/><ellipse cx="22" cy="96" rx="6" ry="9" fill="#fff" opacity=".28" transform="rotate(25 22 96)"/><path d="M10 104c6 4 34 4 40 0" stroke="${brilho}" stroke-width="1.5" fill="none" opacity=".8"/></svg>`;

    let DADOS = null, ITENS = [], FILTRO = 'tudo', BUSCA = '', SACOLA = [], TEMA = 'padrao', ETAPA = 'sacola', CHECKOUT = { entrega: 'retirar', pagamento: 'Pix' }, DETALHE = null;
    const guardar = (k, v) => { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch (e) { /* aba anônima */ } };
    const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v === null ? padrao : JSON.parse(v); } catch (e) { return padrao; } };
    const chaveSacola = () => 'mm_sacola_' + SLUG + (VEND ? '.' + VEND : '');
    function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2400); }
    const post = async corpo => { const r = await (await fetch(API, { method: 'POST', body: JSON.stringify(corpo) })).json(); if (!r.sucesso) { const e = new Error(r.erro || 'erro'); e.negocio = true; throw e; } return r; };
    const SEM_MOVIMENTO = matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('bt-busca').innerHTML = IC.busca; $('ic-busca').innerHTML = IC.busca;

    // ---------- Tema (topo, fundo da página, destaques e rodapé) ----------
    // Título com as últimas palavras na cor do tema ("Um Natal *feito à mão*")
    const tituloDestaque = t => { const p = String(t || '').trim().split(/\s+/); if (p.length < 4) return esc(t); const n = Math.ceil(p.length / 3); return `${esc(p.slice(0, -n).join(' '))} <em>${esc(p.slice(-n).join(' '))}</em>`; };
    function montarTopo(pagina, tema, vitrine) {
        TEMA = tema; const t = temaMM(tema), raiz = document.documentElement, [f1, f2, f3] = fitaMM(tema);
        aplicarTemaMM(raiz, tema);
        raiz.style.setProperty('--padrao', padraoMM(tema)); raiz.style.setProperty('--fita1', f1); raiz.style.setProperty('--fita2', f2); raiz.style.setProperty('--fita3', f3);
        document.querySelector('meta[name="theme-color"]').content = t.hero ? t.hero.fundo : t.cores.papel;
        const hero = $('hero');
        hero.querySelectorAll(':scope > .enfeite, :scope > .bolas').forEach(e => e.remove());
        hero.insertAdjacentHTML('afterbegin', enfeiteMM(tema));
        if (t.enfeite === 'neve') hero.insertAdjacentHTML('afterbegin', `<div class="bolas" aria-hidden="true">${BOLA('#b3262f', '#e3c47e') + BOLA('#e3c47e', '#e3c47e') + BOLA('#c9a24a', '#e3c47e') + BOLA('#b3262f', '#e3c47e')}</div>`);
        $('enfeite-fixo').innerHTML = enfeiteMM(tema, 14, 'fixo');
        const rod = $('rodape'); rod.querySelectorAll('.enfeite').forEach(e => e.remove()); if (t.hero) rod.insertAdjacentHTML('afterbegin', enfeiteMM(tema, 16));
        $('selo').textContent = `${t.emoji} ${t.selo}`;
        $('titulo').innerHTML = tituloDestaque(pagina.titulo || t.titulo);
        $('texto').textContent = pagina.texto || t.texto;
        document.title = `${pagina.titulo || t.titulo} | Mini Mundo`;
        montarVitrine(pagina, vitrine || []);
    }
    // Ao lado do título: a capa da página ou até 3 produtos com foto (destaques primeiro), que abrem o produto
    function montarVitrine(pagina, lista) {
        const v = $('hero-vitrine'), comFoto = lista.filter(i => i.fotos && i.fotos.length).slice(0, 3);

        const fim = new Date(+m[1], m[2] - 1, +m[3], 23, 59, 59), data = `${m[3]}/${m[2]}`;

    const quandoBR = s => { const m = partesData(s); if (!m) return ''; const h = new Date(); h.setHours(0, 0, 0, 0); const dias = Math.round((h - new Date(+m[1], m[2] - 1, +m[3])) / 864e5);
        return `${dias === 0 ? 'hoje' : dias === 1 ? 'ontem' : `${m[3]}/${m[2]}`}${m[4] ? ` às ${m[4]}:${m[5]}` : ''}`; };
    const diaSemana = s => { const m = partesData(s); return m ? new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' }) : ''; };
    const marcaPedido = p => JSON.stringify([p.status, p.pago, (p.historico || []).length, p.atualizado_em, p.data_entrega, p.total]);
    let PEDIDO = null, PUSH = '', VISTO = '', ULTIMA_OLHADA = 0;
    function mostrarPedido(r) {
        DADOS = { loja: r.loja }; PUSH = r.push || ''; PEDIDO = r.pedido; VISTO = marcaPedido(PEDIDO);
        VEND = (r.loja && r.loja.apelido) || ''; // pedido do site de um vendedor: "Ver a coleção" volta para o site dele(a)
        const p = PEDIDO, tema = p.pagina ? p.pagina.tema : 'padrao';
        if (p.pagina && p.pagina.slug) SLUG = p.pagina.slug;
        montarTopo({ titulo: `Pedido #${p.numero}`, texto: `Olá, ${p.cliente || 'tudo bem'}! Aqui você acompanha o seu pedido, passo a passo.` }, tema);
        // Guarda em "Meus pedidos" (também quando abriu pelo link do WhatsApp em outro aparelho)
        const meus = ler('mm_pedidos', []);
        if (!meus.some(m => m.codigo === CODIGO)) { meus.unshift({ codigo: CODIGO, numero: p.numero, pagina: p.pagina ? p.pagina.titulo : '', data: String(p.criado_em).slice(0, 10) }); guardar('mm_pedidos', meus.slice(0, 20)); }
        montarContato();
        $('zap-flutuante').style.display = 'none'; // aqui já tem o botão "Falar sobre o pedido" (o redondo cobria os preços)
        // No iPhone, os avisos só funcionam com a página na tela de início
        if (!document.querySelector('link[rel="manifest"]')) document.head.insertAdjacentHTML('beforeend', '<link rel="manifest" href="loja.webmanifest">');
        desenharPedido(false); vigiarPedido();
    }
    function desenharPedido(mudou) {
        const p = PEDIDO, hist = p.historico || [], cancel = p.status === 'cancelado', L = DADOS.loja || {};
        const atual = ETAPAS.findIndex(e => e[0] === p.status), entregue = p.status === 'entregue';
        // Datas de cada etapa e os recados/pagamento que vieram depois dela
        const datas = {}, eventos = {}; let ultima = 0;
        hist.forEach(h => {
            const i = ETAPAS.findIndex(e => e[0] === h.status);
            if (i >= 0) { datas[i] = h.quando; ultima = i; }
            if (h.status === 'pago') (eventos[ultima] = eventos[ultima] || []).push({ pago: true, quando: h.quando });
            else if (h.recado) (eventos[ultima] = eventos[ultima] || []).push({ texto: h.recado, quando: h.quando });
        });
        const recados = hist.filter(h => h.recado), ultimo = hist[hist.length - 1];
        const e = cancel ? ['cancelado', 'Pedido cancelado', 'Se tiver alguma dúvida, é só falar com a gente.', '🚫'] : ETAPAS[Math.max(0, atual)];
        const semPreco = p.itens.some(i => !i.preco), subtotal = p.itens.reduce((s, i) => s + (i.preco || 0) * i.qtd, 0);
        const z = zap(L.whatsapp, `Olá! Queria falar sobre o meu pedido *#${p.numero}*.\n${linkPedido(CODIGO)}`);
        const ev = x => x.pago ? `<div class="ev pago">✓ Pagamento confirmado<em>${quandoBR(x.quando)}</em></div>` : `<div class="ev">💬 ${esc(x.texto)}<em>${quandoBR(x.quando)}</em></div>`;
        $('conteudo').innerHTML = `<div class="acomp" style="margin-top:24px">
            <div class="bloco st-card ${cancel ? 'cancel' : ''} ${mudou ? 'atualizou' : ''}">${enfeiteMM(TEMA, 10)}
                <div class="st-topo"><span class="st-emoji">${e[3]}</span><div><small>Pedido #${p.numero}</small><h2>${e[1]}</h2><p>${cancel ? e[2] : fraseEtapa(e, p)}</p></div></div>
                <div class="st-barra" aria-hidden="true">${ETAPAS.map((x, i) => `<i class="${cancel ? '' : i < atual || entregue ? 'on' : i === atual ? 'agora' : ''}"></i>`).join('')}</div>
                <div class="st-rodape"><span>Atualizado ${quandoBR(p.atualizado_em || p.criado_em)}</span>${p.data_entrega && !entregue && !cancel ? `<span class="st-prev">📅 Previsão: ${esc(diaSemana(p.data_entrega))}</span>` : ''}</div></div>
            ${ultimo && ultimo.recado ? `<div class="recado"><span>💬</span><div><b>Recado da Mini Mundo</b><p>${esc(ultimo.recado)}</p><small>${quandoBR(ultimo.quando)}</small></div></div>` : ''}
            <div id="avisos-box"></div>
            <div class="bloco"><h2>Andamento</h2>${cancel ? `<p class="cancelado">Este pedido foi cancelado ${quandoBR(p.atualizado_em)}.</p>${recados.map(h => ev({ texto: h.recado, quando: h.quando })).join('')}`
                : `<ol class="etapas">${ETAPAS.map((x, i) => { const feita = i < atual || (entregue && i === atual), agora = i === atual && !entregue;
                    return `<li class="${feita ? 'feita' : agora ? 'agora' : ''}"><span class="bola">${feita ? '✓' : x[3]}</span><span><b>${x[1]}</b>${datas[i] && (feita || agora) ? `<small class="quando">${quandoBR(datas[i])}</small>` : ''}
                        ${agora || (!feita && !agora) ? `<small>${fraseEtapa(x, p)}</small>` : ''}${(eventos[i] || []).map(ev).join('')}</span></li>`; }).join('')}</ol>`}</div>
            <div class="bloco"><h2>Seu pedido</h2>${p.itens.map((i, n) => `<div class="ped-item">
                    <button class="ped-foto" type="button" ${i.fotos && i.fotos.length ? `onclick="fotosDoPedido(${n})" aria-label="Ver fotos de ${esc(i.nome)}"` : 'disabled'}><img src="${esc((i.fotos || [])[0] || 'logo.png')}" alt="" loading="lazy" onerror="this.src='logo.png'">${i.fotos && i.fotos.length > 1 ? `<span>${i.fotos.length}</span>` : ''}</button>
                    <div class="ped-info"><div class="ped-nome"><b>${esc(i.nome)}</b><span>${i.preco ? real(i.preco * i.qtd) : 'a combinar'}</span></div>
                        <div class="ped-qtd">${i.qtd} × ${i.preco ? real(i.preco) : 'preço a combinar'}${i.tipo === 'kit' ? ' · Kit' : ''}</div>
                        ${i.descricao ? `<p class="ped-desc" onclick="this.classList.toggle('aberta')">${esc(i.descricao)}</p>` : ''}
                        ${i.pecas && i.pecas.length ? `<div class="ped-pecas">${i.pecas.map(x => `<span>${x.foto ? `<img src="${esc(x.foto)}" alt="" loading="lazy" onerror="this.remove()">` : ''}${x.qtd}× ${esc(x.nome)}</span>`).join('')}</div>` : ''}</div></div>`).join('')}
                ${p.desconto || p.taxa_entrega ? `<div class="linha-item"><span>Produtos</span><span>${real(subtotal)}</span></div>` : ''}
                ${p.desconto ? `<div class="linha-item"><span>Desconto</span><span>− ${real(p.desconto)}</span></div>` : ''}${p.taxa_entrega ? `<div class="linha-item"><span>Entrega</span><span>${real(p.taxa_entrega)}</span></div>` : ''}
                <div class="linha-total"><span>Total${semPreco ? ' <small>(+ itens a combinar)</small>' : ''}</span><strong>${real(p.total)}</strong></div></div>
            <div class="bloco"><h2>Entrega e pagamento</h2><div class="info-p">
                <div><b>Recebimento</b>${p.entrega === 'entrega' ? 'Entrega no endereço' : 'Retirada'}</div>
                <div><b>Previsão</b>${p.data_entrega ? esc(diaSemana(p.data_entrega)) : 'A gente combina com você'}</div>
                <div><b>Pagamento</b>${esc(p.pagamento || 'A combinar')}${p.pago ? '<span class="tag-pago">Pago</span>' : cancel ? '' : '<span class="tag-pagar">A pagar</span>'}</div>
                <div><b>Feito em</b>${quandoBR(p.criado_em)}${p.pagina ? ` · ${esc(p.pagina.titulo)}` : ''}</div></div>
                ${p.pix ? `<div class="pix"><b>Pague com Pix</b><code>${esc(p.pix)}</code><button class="pilula" type="button" onclick="copiarPix()">Copiar chave Pix</button><small>Valor: ${real(p.total)}${semPreco ? ' + itens a combinar' : ''}. Depois, mande o comprovante no WhatsApp.</small></div>` : ''}</div>
            <div class="acomp-bt">
                ${z ? `<a class="pilula zap" href="${esc(z)}" target="_blank" rel="noopener">${IC.zap} Falar sobre o pedido</a>` : ''}
                <button class="pilula clara" type="button" onclick="compartilharLink('Pedido #${p.numero} · Mini Mundo', 'Acompanhe o pedido #${p.numero} da Mini Mundo', linkPedido(CODIGO))">${IC.share} Guardar ou enviar este link</button>
                ${p.pagina && p.pagina.ativa ? `<a class="pilula clara" href="${esc(linkPagina(p.pagina.slug))}">Ver a coleção ${esc(p.pagina.titulo)}</a>` : ''}</div></div>`;
        montarAvisos();
    }
    function fotosDoPedido(n) { const i = PEDIDO.itens[n]; if (i && i.fotos.length) abrirGaleria({ fotos: i.fotos, indice: 0, titulo: i.nome }); }
    async function copiarPix() { try { await navigator.clipboard.writeText(PEDIDO.pix); toast('Chave Pix copiada'); } catch (e) { prompt('Copie a chave Pix:', PEDIDO.pix); } }
    // Confere o pedido a cada 45 s (e ao voltar para a página); se mudou, redesenha e avisa
    function vigiarPedido() {
        const olhar = async () => {
            if (document.visibilityState !== 'visible') return;
            ULTIMA_OLHADA = Date.now();
            try {
                const r = await post({ acao: 'acompanhar_pedido', c: CODIGO });
                if (marcaPedido(r.pedido) === VISTO) return;
                PEDIDO = r.pedido; VISTO = marcaPedido(PEDIDO); desenharPedido(true); toast('Seu pedido foi atualizado ✨');
            } catch (e) { /* sem internet: tenta na próxima */ }
        };
        setInterval(olhar, 45000);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - ULTIMA_OLHADA > 15000) olhar(); });
        if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', ev => { if (ev.data === 'atualizar') olhar(); });
    }

    // ---------- Avisos no celular (notificação quando o pedido mudar) ----------
    const PUSH_OK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext;
    const IPHONE = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const NA_TELA = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const chaveBytes = b64 => { const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, c => c.charCodeAt(0)); };
    const registroAvisos = () => navigator.serviceWorker.register('loja-sw.js?api=' + encodeURIComponent(API), { scope: './loja' });
    const esperarAtivo = reg => reg.active ? Promise.resolve() : new Promise(ok => { const w = reg.installing || reg.waiting; if (!w) return ok(); w.addEventListener('statechange', () => { if (w.state === 'activated') ok(); }); setTimeout(ok, 8000); });
    async function assinaturaAtual() { try { const reg = await navigator.serviceWorker.getRegistration('./loja'); return reg ? await reg.pushManager.getSubscription() : null; } catch (e) { return null; } }
    async function ativarAvisos(codigo, chave, botao) {
        if (botao) { botao.disabled = true; botao.textContent = 'Ativando…'; }
        let ok = false;
        try {
            if (await Notification.requestPermission() !== 'granted') throw new Error('bloqueado');
            const reg = await registroAvisos(); await esperarAtivo(reg);
            const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveBytes(chave) });
            await post({ acao: 'assinar_avisos', c: codigo, endpoint: sub.endpoint });
            guardar('mm_avisos_' + codigo, 1); ok = true; toast('Pronto! Você vai receber os avisos aqui.');
        } catch (e) { toast(e.message === 'bloqueado' ? 'Os avisos estão bloqueados neste navegador.' : e.negocio ? e.message : 'Não deu para ativar os avisos neste aparelho.'); }
        if (botao) { botao.textContent = ok ? '🔔 Avisos ligados' : '🔔 Me avise quando o pedido mudar'; botao.disabled = ok; }
        if (PEDIDO) montarAvisos();
        return ok;
    }
    async function desligarAvisos() {
        const sub = await assinaturaAtual();
        try { if (sub) await post({ acao: 'cancelar_avisos', c: CODIGO, endpoint: sub.endpoint }); } catch (e) { /* tenta de novo depois */ }
        try { localStorage.removeItem('mm_avisos_' + CODIGO); } catch (e) { /* aba anônima */ }
        toast('Avisos desligados para este pedido'); montarAvisos();
    }
    async function montarAvisos() {
        const box = $('avisos-box'); if (!box) return;
        if (!PUSH || ['entregue', 'cancelado'].includes(PEDIDO.status)) { box.innerHTML = ''; return; }
        if (!PUSH_OK) {
            box.innerHTML = IPHONE && !NA_TELA ? `<div class="bloco avisos"><span>🔔</span><div><b>Quer aviso no iPhone?</b><small>Toque em Compartilhar <b style="display:inline">⎙</b> e depois em “Adicionar à Tela de Início”. Abra o pedido por lá e ative os avisos.</small></div></div>` : '';
            return;
        }
        const ligado = ler('mm_avisos_' + CODIGO, 0) && Notification.permission === 'granted' && await assinaturaAtual();
        box.innerHTML = ligado ? `<div class="bloco avisos ligado"><span>🔔</span><div><b>Avisos ligados ✓</b><small>Você recebe uma notificação neste aparelho quando o pedido mudar.</small></div><a onclick="desligarAvisos()">Desligar</a></div>`
            : Notification.permission === 'denied' ? `<div class="bloco avisos"><span>🔕</span><div><b>Avisos bloqueados</b><small>Para receber, libere as notificações deste site nas configurações do navegador. Esta página também se atualiza sozinha.</small></div></div>`
            : `<div class="bloco avisos"><span>🔔</span><div><b>Quer ser avisado?</b><small>Receba uma notificação neste aparelho quando o pedido mudar de etapa.</small></div><button class="pilula" type="button" onclick="ativarAvisos(CODIGO, PUSH, this)">Ativar avisos</button></div>`;
    }

    // A barra do topo some ao descer (mais espaço para os produtos) e volta ao subir
    let ULTIMO_Y = scrollY;
    addEventListener('scroll', () => {
        const y = scrollY, b = document.body;
        if (y < 140 || !$('tl-busca').hidden) b.classList.remove('topo-oculto');
        else if (y > ULTIMO_Y + 10) b.classList.add('topo-oculto');
        else if (y < ULTIMO_Y - 10) b.classList.remove('topo-oculto');
        if (Math.abs(y - ULTIMO_Y) > 10) ULTIMO_Y = y;
    }, { passive: true });
    new IntersectionObserver(([e]) => $('filtros').classList.toggle('colado', !e.isIntersecting)).observe($('hero'));
    carregar();
</script>
</body>
